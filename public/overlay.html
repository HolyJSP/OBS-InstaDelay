<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delay Bridge overlay</title>
<!--
  OBS Browser Source. Shows a small badge only while a delay is active.
  Options (query string):  ?text=Stream%20delay%20on  &position=top-left|top-right|bottom-left|bottom-right
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #badge {
    position: absolute; display: inline-flex; align-items: center; gap: 10px;
    background: rgba(14, 16, 19, .82); color: #fff; border: 1px solid rgba(255, 181, 71, .55);
    padding: 10px 16px; border-radius: 10px; font-size: 22px; font-weight: 700; letter-spacing: .02em;
    opacity: 0; transform: translateY(-6px); transition: opacity .35s, transform .35s;
  }
  #badge.show { opacity: 1; transform: none; }
  #badge svg { width: 24px; height: 24px; color: #ffb547; }
  .top-left { top: 24px; left: 24px; } .top-right { top: 24px; right: 24px; }
  .bottom-left { bottom: 24px; left: 24px; } .bottom-right { bottom: 24px; right: 24px; }
</style>
</head>
<body>
<div id="badge">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
  <span id="label"></span>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const badge = document.getElementById('badge');
  badge.classList.add(q.get('position') || 'top-right');
  const template = q.get('text') || 'Stream delay: {delay}';
  let last = '';
  async function poll() {
    try {
      const s = await (await fetch('/api/status')).json();
      const d = Math.round(s.engine.delayMs / 1000);
      const txt = d >= 60 && d % 60 === 0 ? `${d / 60} min` : `${d}s`;
      const label = template.replace('{delay}', txt);
      if (label !== last) { document.getElementById('label').textContent = label; last = label; }
      if (badge.classList.contains('show') !== d > 0) badge.classList.toggle('show', d > 0);
    } catch { badge.classList.remove('show'); }
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
