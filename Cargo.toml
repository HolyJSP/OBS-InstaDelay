[package]
name = "delay-bridge"
version = "1.3.1"
description = "Add, change or remove stream delay while live — an RTMP bridge for OBS and Streamlabs to beat stream snipers."
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/HolyJSP/delay-bridge"
readme = "README.md"
keywords = ["obs", "rtmp", "stream-delay", "twitch", "streaming"]
categories = ["multimedia::video", "command-line-utilities"]
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
fdk-aac = "0.8"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia-codec-aac = "0.6"
symphonia-core = "0.6"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "io-util", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
webpki-roots = "1.0.12"

[workspace]
members = [".", "obs-plugin"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
